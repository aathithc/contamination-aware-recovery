[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "care"
version = "0.1.0"
description = "Contamination-Aware Recovery for Multi-Turn LLM Conversations"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.20"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/care"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
